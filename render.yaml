services:
  - type: web
    name: estacionamiento-medido
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: "node server.mjs"
    healthCheckPath: /
    envVars:
      - key: OPERATOR_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
